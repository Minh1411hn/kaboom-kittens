# Dev overrides — applied automatically by `docker compose up`.
# Runs the Nuxt dev server with HMR against a bind-mounted source tree.
services:
  web:
    build:
      context: .
      target: development
    command: sh -c "npm run gen:art && npm run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      # Named (not anonymous) so it can be inspected and dropped on purpose:
      #   docker compose down -v   or   docker volume rm kaboom-kittens_node_modules
      # Recreate it after changing package.json, otherwise the container keeps
      # serving the node_modules snapshot from when the volume was first created.
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "24678:24678" # Vite HMR

volumes:
  node_modules:
    driver: local
