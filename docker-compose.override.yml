# Dev overrides — applied automatically by `docker compose up`.
# Runs the Nuxt dev server with HMR against a bind-mounted source tree.
services:
  web:
    build:
      context: .
      target: build
    command: sh -c "npm run gen:art && npm run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    ports:
      - "3000:3000"
      - "24678:24678" # Vite HMR
