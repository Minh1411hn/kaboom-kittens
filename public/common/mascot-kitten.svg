<svg xmlns="http://www.w3.org/2000/svg" width="220" height="200" viewBox="0 0 220 200">
  <!--
    Simple flat mascot silhouette matching the hero title's gold-to-orange
    gradient. Kept deliberately plain (a handful of shapes) to match the
    project's existing placeholder-grade card art, not a detailed illustration.
  -->
  <defs>
    <linearGradient id="mascot-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#ff8a1a" />
    </linearGradient>
    <linearGradient id="mascot-tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a1a" />
      <stop offset="100%" stop-color="#c1770a" />
    </linearGradient>
  </defs>

  <!-- tail, curling out behind the body -->
  <path
    d="M60 168 C18 160 6 128 22 104 C32 90 48 92 46 106 C44 118 34 122 40 138 C46 152 62 154 66 166 Z"
    fill="url(#mascot-tail)"
  />

  <!-- ears -->
  <path d="M56 46 L44 8 L82 40 Z" fill="url(#mascot-body)" />
  <path d="M150 46 L168 6 L178 42 Z" fill="url(#mascot-body)" />

  <!-- body: rounded, fat, crouching -->
  <path
    d="M110 34
       C150 34 182 58 190 96
       C198 134 178 176 110 176
       C42 176 22 134 30 96
       C38 58 70 34 110 34
       Z"
    fill="url(#mascot-body)"
  />

  <!-- eyes -->
  <ellipse cx="86" cy="96" rx="9" ry="11" fill="#7a1414" />
  <ellipse cx="134" cy="96" rx="9" ry="11" fill="#7a1414" />
</svg>
