<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
  <!--
    Tileable background texture: a handful of faint game-icon glyphs (paw,
    exclamation, footprint, heart, hand) scattered at low opacity so the
    background reads as texture, not iconography, from normal viewing
    distance. Tiled via CSS `background-repeat: repeat` at 340x340.
  -->
  <g fill="#2a0708" fill-opacity="0.3">
    <!-- paw print, upper-left -->
    <g transform="translate(40 50) rotate(-12)">
      <ellipse cx="0" cy="14" rx="13" ry="10" />
      <ellipse cx="-14" cy="-8" rx="5" ry="6.5" />
      <ellipse cx="-4" cy="-16" rx="5" ry="6.5" />
      <ellipse cx="8" cy="-16" rx="5" ry="6.5" />
      <ellipse cx="17" cy="-8" rx="5" ry="6.5" />
    </g>

    <!-- exclamation mark, upper-right -->
    <g transform="translate(270 70) rotate(8)">
      <rect x="-6" y="-28" width="12" height="34" rx="6" />
      <circle cx="0" cy="16" r="7" />
    </g>

    <!-- heart, center-left -->
    <path
      transform="translate(90 180) rotate(-6) scale(1.1)"
      d="M0 14 C-16 0 -22 -14 -12 -20 C-5 -24 0 -18 0 -14 C0 -18 5 -24 12 -20 C22 -14 16 0 0 14 Z"
    />

    <!-- footprint, center-right -->
    <g transform="translate(250 200) rotate(14)">
      <ellipse cx="0" cy="10" rx="11" ry="16" />
      <circle cx="-9" cy="-14" r="4" />
      <circle cx="-2" cy="-19" r="4.2" />
      <circle cx="6" cy="-19" r="4" />
      <circle cx="13" cy="-15" r="3.6" />
    </g>

    <!-- open hand, lower-left -->
    <g transform="translate(60 290) rotate(4) scale(0.9)">
      <rect x="-14" y="-6" width="28" height="26" rx="9" />
      <rect x="-13" y="-24" width="6" height="22" rx="3" />
      <rect x="-5" y="-28" width="6" height="26" rx="3" />
      <rect x="3" y="-28" width="6" height="26" rx="3" />
      <rect x="11" y="-24" width="6" height="22" rx="3" />
    </g>

    <!-- small paw print, lower-right, smaller/fainter -->
    <g transform="translate(300 300) rotate(20) scale(0.7)" fill-opacity="0.7">
      <ellipse cx="0" cy="14" rx="13" ry="10" />
      <ellipse cx="-14" cy="-8" rx="5" ry="6.5" />
      <ellipse cx="-4" cy="-16" rx="5" ry="6.5" />
      <ellipse cx="8" cy="-16" rx="5" ry="6.5" />
      <ellipse cx="17" cy="-8" rx="5" ry="6.5" />
    </g>
  </g>
</svg>
